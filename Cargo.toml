[package]
name = "chance"
version = "0.1.0"
edition = "2021"
authors = ["Simon Gonzalez De Cruz"]
description = "A fancy, fun, beautiful multi-source random number generator."
license = "MIT"
repository = "https://github.com/simongonzalezdecruz/chance"
rust-version = "1.80"

[[bin]]
name = "chance"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }

# RNG ecosystem
rand = "0.8"
rand_chacha = "0.3"
rand_pcg = "0.3"
rand_xoshiro = "0.6"

getrandom = "0.2"


# Serialization (API/MCP/CLI JSON surfaces)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Errors
thiserror = "1.0"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async runtime + HTTP server
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }
axum = { version = "0.7", optional = true }
tower-http = { version = "0.5", features = ["timeout", "limit", "trace", "cors"], optional = true }

# TUI (ratatui) — optional for now
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

# HTTP client for external network source (drand)
reqwest = { version = "0.12", features = ["json", "blocking"], optional = true }
# BLS12-381 for optional drand signature verification (opt-in via `drand-verify`)
blst = { version = "0.3", optional = true }

# Source mixing
sha2 = { version = "0.10", optional = true }
hkdf = { version = "0.12", optional = true }

[features]
default = ["external-sources", "mixing", "api", "mcp", "tui"]
api = ["tokio", "axum", "tower-http"]
# Gates the JSON-RPC-over-stdio MCP module; reuses always-on serde_json.
mcp = []
tui = ["ratatui", "crossterm", "tokio"]
external-sources = ["reqwest"]
mixing = ["sha2", "hkdf"]
drand-verify = ["blst", "external-sources"]

[dev-dependencies]
